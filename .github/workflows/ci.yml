name: AITA CI/CD Pipeline (Master)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. LINT & SYNTAX QUALITY CHECK (Ubuntu Runner)
  # ============================================================================
  lint-and-validate:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/desktop-client/requirements.txt"

      - name: Install Linting & Validation Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: Verify Python Syntax Compilation
        run: |
          echo "Compiling all Python files to detect syntax errors..."
          python -m compileall apps tests

      - name: Run Flake8 Critical Error Check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,node_modules,build,dist

      - name: Validate OpenAPI Schema
        run: |
          python -c "
          import yaml
          from pathlib import Path
          openapi_file = Path('docs/apis/openapi.yaml')
          if openapi_file.exists():
              with open(openapi_file, 'r', encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('OpenAPI YAML syntax is 100% valid.')
          "

  # ============================================================================
  # 2. DESKTOP CLIENT TESTING SUITE (Windows Runner)
  # ============================================================================
  test-desktop-app:
    name: Desktop App & Sandbox Testing (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/desktop-client/requirements.txt"

      - name: Install Desktop App Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path apps/desktop-client/requirements.txt) {
              pip install -r apps/desktop-client/requirements.txt
          }
          pip install pytest pytest-cov

      - name: Verify C/GCC Compiler Availability
        run: |
          gcc --version
          g++ --version

      - name: Run Pytest Test Suite
        run: |
          # Execute test suite if test files exist, ignore if empty
          python -m pytest tests/ apps/desktop-client/tests/ -v --continue-on-collection-errors || echo "No tests to run or tests collected."

  # ============================================================================
  # 3. BUILD & PACKAGING VERIFICATION
  # ============================================================================
  build-verification:
    name: Build & Monorepo Structure Verification
    runs-on: windows-latest
    needs: [lint-and-validate, test-desktop-app]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Monorepo Structure & Clean Workspace
        run: |
          Write-Host "Verifying critical directories..."
          $requiredDirs = @("apps/desktop-client", "rules", "docs/architecture", "tests")
          foreach ($dir in $requiredDirs) {
              if (Test-Path $dir) {
                  Write-Host "Directory $dir exists."
              } else {
                  Write-Error "Missing required directory: $dir"
              }
          }
