name: AITA Full Monorepo CI/CD Pipeline (Master)

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. CORE SYNTAX & OPENAPI SPEC QUALITY CHECK
  # ============================================================================
  lint-and-validate:
    name: Code Quality & Spec Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/desktop-client/requirements.txt"

      - name: Install Linting & Validation Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: Verify Python Syntax Compilation
        run: |
          echo "Compiling all Python files to detect syntax errors..."
          python -m compileall apps tests

      - name: Run Flake8 Critical Error Check
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,node_modules,build,dist

      - name: Validate OpenAPI Schema (YAML)
        run: |
          python -c "
          import yaml
          from pathlib import Path
          openapi_file = Path('docs/apis/openapi.yaml')
          if openapi_file.exists():
              with open(openapi_file, 'r', encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('OpenAPI YAML syntax is 100% valid.')
          "

  # ============================================================================
  # 2. CENTRAL BACKEND (NestJS + Prisma) CI PIPELINE
  # ============================================================================
  backend-nestjs-ci:
    name: Central Backend (NestJS & Prisma)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aita?schema=public"
      DATABASE_URL_UNPOOLED: "postgresql://postgres:postgres@localhost:5432/aita?schema=public"
      JWT_ACCESS_SECRET: "ci-dummy-jwt-access-secret-32-chars-long"
      JWT_REFRESH_SECRET: "ci-dummy-jwt-refresh-secret-32-chars-long"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check if NestJS project is initialized
        id: check_backend
        run: |
          if [ -f "apps/central-backend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "NestJS project detected in apps/central-backend."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No package.json in apps/central-backend yet (scaffold stage). Skipping build."
          fi

      - name: Setup Node.js 20
        if: steps.check_backend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NestJS Dependencies
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: apps/central-backend
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate Prisma Schema
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: apps/central-backend
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma validate
          fi

      - name: Run NestJS Linter, Test & Build
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: apps/central-backend
        run: |
          npm run lint --if-present
          npm run test --if-present
          npm run build --if-present

  # ============================================================================
  # 3. WEB ADMIN (Next.js + React) CI PIPELINE
  # ============================================================================
  web-admin-nextjs-ci:
    name: Web Admin (Next.js & React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check if Next.js project is initialized
        id: check_frontend
        run: |
          if [ -f "apps/web-admin/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Next.js project detected in apps/web-admin."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No package.json in apps/web-admin yet (scaffold stage). Skipping build."
          fi

      - name: Setup Node.js 20
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Next.js Dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: apps/web-admin
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Next.js Lint & Build
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: apps/web-admin
        run: |
          npm run lint --if-present
          npm run build --if-present

  # ============================================================================
  # 4. DESKTOP CLIENT FAST TESTS (Ubuntu) - unit + integration feedback loop
  # ============================================================================
  desktop-client-test-ubuntu:
    name: Desktop Client Fast Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/desktop-client/requirements.txt"

      - name: Install Desktop Client Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/desktop-client/requirements.txt
          pip install pytest pytest-cov

      - name: Run Fast Test Suite (unit + integration)
        run: |
          mkdir -p reports
          python -m pytest tests/unit tests/integration -v --junitxml=reports/junit-ubuntu.xml --durations=10

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports-ubuntu
          path: reports/
          if-no-files-found: ignore

  # ============================================================================
  # 5. DESKTOP CLIENT FULL TEST SUITE (Windows) - PyQt6 offscreen + real toolchains
  # ============================================================================
  desktop-client-ci:
    name: Desktop Client Full Tests & Sandbox (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/desktop-client/requirements.txt"

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Desktop Client Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path apps/desktop-client/requirements.txt) {
              pip install -r apps/desktop-client/requirements.txt
          }
          pip install pytest pytest-cov

      - name: Verify C/GCC Compiler Availability
        run: |
          gcc --version
          g++ --version

      - name: Run Full Pytest Test Suite (unit/integration/system/acceptance/e2e/performance)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          python -m pytest tests/ apps/desktop-client/tests/ -v --continue-on-collection-errors `
            --cov=apps/desktop-client/src --cov-report=term --cov-report=xml:reports/coverage.xml `
            --junitxml=reports/junit.xml --durations=10
          if ($LASTEXITCODE -ne 0) { throw "Pytest suite failed (exit $LASTEXITCODE)" }

      - name: Upload Test Reports & Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports-windows
          path: reports/
          if-no-files-found: ignore

  # ============================================================================
  # 6. MONOREPO STRUCTURE & INTEGRATION VERIFICATION
  # ============================================================================
  monorepo-verification:
    name: Monorepo Integrity Check
    runs-on: ubuntu-latest
    needs: [lint-and-validate, backend-nestjs-ci, web-admin-nextjs-ci, desktop-client-test-ubuntu, desktop-client-ci]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Monorepo Structure
        run: |
          echo "Verifying monorepo architecture structure..."
          test -d apps/central-backend || exit 1
          test -d apps/web-admin || exit 1
          test -d apps/desktop-client || exit 1
          test -d docs/architecture || exit 1
          test -d rules || exit 1
          echo "All monorepo apps and core directories are intact."
