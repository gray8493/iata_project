[pytest]
addopts = -p no:cacheprovider
pythonpath = apps/desktop-client/src
markers =
    unit: Unit tests (tests/unit)
    integration: Integration tests (tests/integration)
    system: System tests with offscreen Qt (tests/system)
    acceptance: Acceptance/workflow tests (tests/acceptance)
    e2e: End-to-end tests with real toolchain (tests/e2e)
    performance: Performance tests with time budgets (tests/performance)
