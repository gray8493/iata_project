openapi: 3.0.3
info:
  title: AITA AI Hub API (OpenRouter multi-key)
  version: 1.1.0
  description: Phân hệ API điều phối AI qua OpenRouter (xoay vòng nhiều API key) — sinh testcase, review code, quét đạo văn, chấm UI web; model cấu hình tại backend.
paths:
  /ai/quota:
    get:
      summary: Lấy hạn ngạch token hôm nay
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              example:
                success: true
                status_code: 200
                message: Lấy hạn ngạch thành công
                data:
                  daily_limit_tokens: 50000
                  used_tokens_today: 12450
                  remaining_tokens: 37550
                  reset_at_utc: '2026-10-22T00:00:00.000Z'
                timestamp: '2026-09-30T12:00:00.000Z'
  /ai/generate-testcases:
    post:
      summary: Sinh testcase biên bằng AI Hub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problem_description, language]
              properties:
                problem_description:
                  type: string
                  minLength: 20
                language:
                  type: string
                  enum: [C, JAVA, PYTHON, WEB]
                count:
                  type: integer
                  default: 3
      responses:
        '200':
          description: Thành công
        '429':
          description: Hết quota token
  /ai/review-code:
    post:
      summary: Nhận xét sư phạm cho code WA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_code, language, problem_statement, failed_testcase]
              properties:
                source_code:
                  type: string
                language:
                  type: string
                problem_statement:
                  type: string
                failed_testcase:
                  type: object
      responses:
        '200':
          description: Thành công
        '429':
          description: Hết quota
  /ai/verify-plagiarism:
    post:
      summary: Xác thực đạo văn Vòng 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_a_code, student_b_code, ast_similarity_percentage, language]
              properties:
                student_a_code:
                  type: string
                student_b_code:
                  type: string
                ast_similarity_percentage:
                  type: number
                  minimum: 80.0
                language:
                  type: string
                  enum: [C, JAVA, PYTHON, PHP]
      responses:
        '200':
          description: Thành công — data gồm tokens_consumed + ket_luan, do_tin_cay, bang_chung[{mo_ta, dong_a, dong_b}], khac_biet, de_xuat
          content:
            application/json:
              example:
                success: true
                status_code: 200
                message: Đối soát đạo văn bằng AI hoàn tất
                data:
                  tokens_consumed: 510
                  ket_luan: Hai đoạn mã có nhiều dấu hiệu sao chép có chủ đích.
                  do_tin_cay: 94.8
                  bang_chung:
                    - mo_ta: Cùng đổi tên biến nhưng cấu trúc lặp giống hệt.
                      dong_a: [5, 9]
                      dong_b: [6, 10]
                  khac_biet: [Hai đoạn có phần xử lý lỗi khác nhau ở cuối.]
                  de_xuat: [Yêu cầu sinh viên giải thích thuật toán trước hội đồng.]
                timestamp: '2026-09-30T12:00:00.000Z'
  /ai/evaluate-web-ui:
    post:
      summary: Đánh giá giao diện Web bằng AI Vision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screenshot_base64, rubric_requirements]
              properties:
                screenshot_base64:
                  type: string
                rubric_requirements:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Thành công — data gồm tokens_consumed, ui_score, evaluation_details[{criterion, score, verdict, comment, bounding_box}], overall_feedback
  /ai/evaluate-pe-code:
    post:
      summary: Chấm chất lượng mã nguồn PE theo 5 tiêu chí Rubric (mỗi tiêu chí 1.0 điểm)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_code, language]
              properties:
                source_code:
                  type: string
                  minLength: 10
                  maxLength: 20000
                language:
                  type: string
                  enum: [C, JAVA, PYTHON, PHP]
                problem_statement:
                  type: string
                  maxLength: 5000
      responses:
        '200':
          description: Thành công
        '429':
          description: Hết quota token
  /ai/provider-status:
    get:
      summary: Trạng thái AI Hub OpenRouter (xoay vòng đa tài khoản, chỉ ADMIN)
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              example:
                success: true
                status_code: 200
                message: Lấy trạng thái AI Hub thành công
                data:
                  provider: openrouter
                  model: openrouter/free
                  accounts_configured: 3
                  structured_outputs_supported: true
                  accounts:
                    - account: ACC-01
                      key_hint: 'sk-or-v1-…fbea'
                      state: READY
                      cooldown_remaining_seconds: 0
                    - account: ACC-02
                      key_hint: 'sk-or-v1-…81ac'
                      state: COOLDOWN
                      cooldown_remaining_seconds: 42
        '403':
          description: Chỉ ADMIN được xem trạng thái
